[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f500"
version = "0.1.0"
description = "Financial Econometrics Problem Set 1 - Stock Return Analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"


dependencies = [
    # Data acquisition
    "yfinance>=0.2.36",
    "pandas-datareader>=0.10.0",
    
    # Core data analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # Statistical analysis
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.18.0",
    
    # Excel/Data export
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    
    # Additional utilities
    "python-dateutil>=2.8.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipython>=8.12.0",
    "black>=23.0.0",
    "pylint>=2.17.0",
    "pytest>=7.4.0",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.pylint]
max-line-length = 100
disable = [
    "C0103",  # Invalid name
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
]
